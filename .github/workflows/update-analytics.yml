name: Update Profile Analytics

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Debug - List files
        run: |
          echo "=== PWD ===" && pwd && ls -la
          echo "=== Git status ===" && git status
          echo "=== Git remote ===" && git remote -v
      
      - name: Fetch analytics
        run: |
          echo "=== fetch_analytics.py ===" 
          cat fetch_analytics.py
          echo "=== Running ===" 
          python3 fetch_analytics.py 2>&1 || echo "fetch_analytics.py failed with exit code $?"
      
      - name: Generate cards
        run: |
          echo "=== generate_cards.py ===" 
          head -20 generate_cards.py
          echo "=== Running ===" 
          python3 generate_cards.py 2>&1 || echo "generate_cards.py failed with exit code $?"
      
      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --staged --quiet && echo "Nothing to commit" || { git commit -m "Update analytics $(date +'%Y-%m-%d %H:%M')"; git push; }
