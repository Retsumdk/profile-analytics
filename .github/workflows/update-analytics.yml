name: Update Profile Analytics

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch and generate
        run: |
          python3 fetch_analytics.py
          python3 generate_cards.py
      
      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update analytics $(date +'%Y-%m-%d %H:%M')"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/Retsumdk/profile-analytics.git && git push origin HEAD:main
          fi
